# Netlify: builds apps/web (self-contained Next.js app, no workspace deps).
[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js Runtime: routes dynamic pages via functions (without this, all routes 404).
[[plugins]]
  package = "@netlify/plugin-nextjs"
